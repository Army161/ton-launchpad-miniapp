<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#04070D" />
    <meta name="description" content="TON Meme Coin Launchpad — create, trade, and graduate tokens on STON.fi via Telegram Mini App" />
    <link rel="icon" type="image/png" href="/icon-180.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <title>TON Launchpad</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <!-- Paint only: roughens the edges of spray-paint buttons and swatches (see src/index.css). -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <filter id="spray-edge" x="-6%" y="-40%" width="112%" height="180%">
        <feTurbulence type="fractalNoise" baseFrequency="0.03 0.11" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="torn-edge" x="-6%" y="-6%" width="112%" height="112%">
        <feTurbulence type="fractalNoise" baseFrequency="0.11" numOctaves="2" seed="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
