name: Claude assistant

# Mention @claude in a PR or issue comment to ask questions, request fixes, or (owner only) merge.
# Needs ONE repository secret: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) or ANTHROPIC_API_KEY.
# Only the repository owner's comments trigger it, so nobody else can spend the quota or ask for a merge.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.review.author_association == 'OWNER') ||
        (github.event_name == 'issues' && contains(format('{0} {1}', github.event.issue.title, github.event.issue.body), '@claude') && github.event.issue.author_association == 'OWNER')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Check for a Claude credential
        id: cred
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH" ] || [ -n "$API_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Claude skipped: add CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY as a repository secret."; fi

      - uses: actions/checkout@v4
        if: steps.cred.outputs.ok == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.cred.outputs.ok == 'true'
        with:
          node-version: 22

      - uses: anthropics/claude-code-action@v1
        if: steps.cred.outputs.ok == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          claude_args: |
            --allowedTools "Bash(npm ci:*),Bash(npm run:*),Bash(npm test:*),Bash(npx:*),Bash(git:*),Bash(gh pr:*),Bash(gh run:*),Bash(gh issue:*)"
            --append-system-prompt "Follow CLAUDE.md. Never deploy, never run scripts/launch-production.sh or any mainnet command, never print or commit secrets. Merge a PR only when the repository owner explicitly asks in this comment, and only after 'gh pr checks' shows every check passing and no review says 'Changes needed'; merge with 'gh pr merge --merge'. Otherwise report what blocks the merge."
