name: Claude PR review

# Reviews every pull request with Claude and posts the findings on the PR.
# Needs ONE repository secret: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`)
# or ANTHROPIC_API_KEY. Without either, the job skips with a notice instead of failing.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Check for a Claude credential
        id: cred
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH" ] || [ -n "$API_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Claude review skipped: add CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY as a repository secret."; fi

      - uses: actions/checkout@v4
        if: steps.cred.outputs.ok == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: steps.cred.outputs.ok == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md, docs/SPEC.md and docs/SECURITY.md first.
            Focus on, in order:
            1. Smart-contract correctness and fund safety (contracts/): fee split 2% with 60/40 or 60/20/20,
               solvency of the bonding curve, bounce handling, access control, graduation at 1,500 TON.
            2. Secrets: nothing secret in VITE_* variables, logs, docs or committed .env files.
            3. Tests: contract changes need sandbox tests in contracts/tests; no skipped or weakened tests.
            4. Bugs in app/API code, then docs that no longer match behaviour.
            Use inline comments for specific lines and one summary comment that ends with a verdict:
            "Ready to merge" or "Changes needed" with the blocking items. Skip style nits.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*)"
